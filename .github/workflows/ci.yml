name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node >= 23 runs the plain-TypeScript test files natively
          # (type stripping); the test files use node:assert + node --test.
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build renderer
        run: npm run build
      - name: Run frontend tests
        run: npm test

  rust:
    name: Rust (check + clippy + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        run: cargo check --locked
      - name: cargo clippy
        run: cargo clippy --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked

  linux-appimage:
    name: Linux AppImage smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Linux build and Wayland dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf rpm weston wayland-utils libgtk-3-bin \
            python3-gi gir1.2-gtk-3.0 xvfb xauth procps
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux AppImage
        run: npm run dist:linux
      - name: Verify production renderer assets
        working-directory: src-tauri
        run: cargo test --release --locked --features custom-protocol production_renderer_embeds_index_html
      - name: Launch AppImage in native Wayland
        run: |
          appimage=$(find src-tauri/target -path '*/bundle/appimage/*.AppImage' -type f -print -quit)
          test -n "$appimage"
          bash scripts/wayland-appimage-smoke-test.sh "$appimage"
      - name: Launch AppImage in X11
        run: |
          appimage=$(find src-tauri/target -path '*/bundle/appimage/*.AppImage' -type f -print -quit)
          test -n "$appimage"
          bash scripts/x11-appimage-smoke-test.sh "$appimage"
      - name: Test AppImage on Ubuntu 26.04 userspace
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:26.04 \
            bash -lc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                dbus-x11 xvfb xauth procps libwebkit2gtk-4.1-0 libgtk-3-0t64
              appimage=$(find src-tauri/target -path "*/bundle/appimage/*.AppImage" -type f -print -quit)
              test -n "$appimage"
              bash scripts/x11-appimage-smoke-test.sh "$appimage"
            '

  miner-binaries:
    name: Miner binaries are executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unix miner binaries must have the executable bit
        run: |
          status=0
          for f in Miner/Xmrig/linux-x64/xmrig \
                   Miner/Xmrig/macos-arm64/xmrig \
                   Miner/Xmrig/macos-x64/xmrig; do
            mode=$(git ls-files -s "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::$f is committed with mode $mode (expected 100755)." \
                   "Without the executable bit, spawning the miner fails on macOS/Linux" \
                   "with 'Permission denied (os error 13)'."
              status=1
            fi
          done
          exit $status
      - name: Bundled Linux XMRig must start and match the pinned version
        run: |
          expected=$(tr -d '\r\n' < Miner/Xmrig/VERSION)
          actual=$(Miner/Xmrig/linux-x64/xmrig --version | awk 'NR == 1 { print $2 }')
          test "$actual" = "$expected"

  miner-windows:
    name: Windows XMRig starts with the pinned version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bundled Windows XMRig
        shell: pwsh
        run: |
          $expected = (Get-Content Miner/Xmrig/VERSION -Raw).Trim()
          $actual = (& Miner/Xmrig/win-x64/xmrig.exe --version | Select-Object -First 1).Split()[-1]
          if ($actual -ne $expected) {
            throw "Bundled XMRig version $actual does not match pinned version $expected"
          }
