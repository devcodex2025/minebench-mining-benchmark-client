name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node >= 23 runs the plain-TypeScript test files natively
          # (type stripping); the test files use node:assert + node --test.
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build renderer
        run: npm run build
      - name: Run frontend tests
        run: npm test

  rust:
    name: Rust (check + clippy + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        run: cargo check --locked
      - name: cargo clippy
        run: cargo clippy --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked

  linux-appimage:
    name: Linux AppImage smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Linux build and Wayland dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf rpm weston wayland-utils libgtk-3-bin \
            python3-gi gir1.2-gtk-3.0 xvfb xauth procps
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux AppImage
        run: npm run dist:linux
      - name: Verify production renderer assets
        working-directory: src-tauri
        run: cargo test --release --locked --features custom-protocol production_renderer_embeds_index_html
      - name: Launch AppImage in native Wayland
        run: |
          appimage=$(find src-tauri/target -path '*/bundle/appimage/*.AppImage' -type f -print -quit)
          test -n "$appimage"
          bash scripts/wayland-appimage-smoke-test.sh "$appimage"
      - name: Launch AppImage in X11
        run: |
          appimage=$(find src-tauri/target -path '*/bundle/appimage/*.AppImage' -type f -print -quit)
          test -n "$appimage"
          bash scripts/x11-appimage-smoke-test.sh "$appimage"
      - name: Test AppImage on Ubuntu 26.04 userspace
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:26.04 \
            bash -lc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                dbus-x11 xvfb xauth procps libwebkit2gtk-4.1-0 libgtk-3-0t64
              appimage=$(find src-tauri/target -path "*/bundle/appimage/*.AppImage" -type f -print -quit)
              test -n "$appimage"
              WEBKIT_DISABLE_COMPOSITING_MODE=1 bash scripts/x11-appimage-smoke-test.sh "$appimage"
            '

  miner-binaries:
    name: Miner binaries are executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unix miner binaries must have the executable bit
        run: |
          status=0
          for f in Miner/Xmrig/linux-x64/xmrig \
                   Miner/Xmrig/macos-arm64/xmrig \
                   Miner/Xmrig/macos-x64/xmrig; do
            mode=$(git ls-files -s "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::$f is committed with mode $mode (expected 100755)." \
                   "Without the executable bit, spawning the miner fails on macOS/Linux" \
                   "with 'Permission denied (os error 13)'."
              status=1
            fi
          done
          exit $status
      - name: Bundled Linux XMRig must start and match the pinned version
        run: |
          expected=$(tr -d '\r\n' < Miner/Xmrig/VERSION)
          actual=$(Miner/Xmrig/linux-x64/xmrig --version | awk 'NR == 1 { print $2 }')
          test "$actual" = "$expected"

  miner-windows:
    name: Windows XMRig starts with the pinned version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bundled Windows XMRig
        shell: pwsh
        run: |
          $expected = (Get-Content Miner/Xmrig/VERSION -Raw).Trim()
          $actual = (& Miner/Xmrig/win-x64/xmrig.exe --version | Select-Object -First 1).Split()[-1]
          if ($actual -ne $expected) {
            throw "Bundled XMRig version $actual does not match pinned version $expected"
          }

  # The CPU sensor broker is the only component that needs elevation, and it is a
  # second binary of the same Cargo package, so it could silently stop building
  # or stop emitting valid JSON while the GUI still worked.
  #
  # A runner has no PawnIO driver, so this cannot verify a real temperature
  # reading. What it does verify: the broker builds, its protocol tests pass, it
  # runs and writes valid JSON, it reports "unavailable" rather than a fabricated
  # zero when the driver is absent, and the installer's registration script
  # parses.
  sensor-broker-windows:
    name: CPU sensor broker builds, runs and degrades cleanly
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build the broker
        working-directory: src-tauri
        run: cargo build --release --bin minebench-sensor-broker

      - name: Broker protocol tests
        working-directory: src-tauri
        run: cargo test --release --bin minebench-sensor-broker

      - name: Broker runs and emits valid JSON without the driver
        shell: pwsh
        run: |
          $broker = 'src-tauri/target/release/minebench-sensor-broker.exe'
          if (-not (Test-Path $broker)) { throw "the broker was not built at $broker" }

          $out = Join-Path $env:TEMP 'broker.json'
          Remove-Item $out -ErrorAction SilentlyContinue
          & $broker --out $out
          if (-not (Test-Path $out)) { throw 'the broker produced no snapshot' }

          $snapshot = Get-Content $out -Raw | ConvertFrom-Json
          if ($snapshot.schema -ne 1) { throw "unexpected schema $($snapshot.schema)" }
          if ($snapshot.provider -ne 'none') {
            throw "expected provider 'none' without the driver, got '$($snapshot.provider)'"
          }
          # The whole point: no driver must mean null, never a fabricated 0 C.
          if ($null -ne $snapshot.temperature_c) {
            throw "expected no temperature without the PawnIO driver, got $($snapshot.temperature_c)"
          }
          # The fan channels are empty for the same reason, and the fields exist
          # so a client can tell "no controller" from "no CPU-bound channel".
          if (@($snapshot.fans).Count -ne 0) {
            throw "expected no fan channels without the driver, got $($snapshot.fans.Count)"
          }
          if ($null -ne $snapshot.fan_rpm) {
            throw "expected no fan reading without the driver, got $($snapshot.fan_rpm)"
          }
          Write-Host "broker reported: $($snapshot.provider_detail)"

      - name: Every PawnIO module the broker can ask for is shipped
        shell: pwsh
        run: |
          # A missing module does not fail loudly: the broker simply reports no
          # temperature, or no fan, on every user's machine. Pin the names the
          # source asks for against the files the bundle carries.
          $modules = 'src-tauri/resources/pawnio-modules'
          $broker = Get-Content 'src-tauri/src/bin/sensor_broker.rs' -Raw
          foreach ($name in 'AMDFamily17.bin', 'IntelMSR.bin', 'LpcIO.bin') {
            if ($broker -notmatch [regex]::Escape($name)) {
              throw "$name is not referenced by the broker"
            }
            if (-not (Test-Path (Join-Path $modules $name))) {
              throw "$name is not shipped in $modules"
            }
          }
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw
          if ($config -notmatch 'resources/pawnio-modules') {
            throw 'the PawnIO modules are not bundled as resources'
          }
          Write-Host 'pawnio modules: ok'

      - name: Registration script parses and reports status
        shell: pwsh
        run: |
          # The installer calls this script on every user's machine, so a syntax
          # error would otherwise only surface there.
          $script = 'src-tauri/resources/sensor-broker/register-broker-task.ps1'
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $script), [ref]$null, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            throw "registration script has syntax errors: $($errors[0].Message)"
          }
          $status = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Operation status
          Write-Host "status: $status"
