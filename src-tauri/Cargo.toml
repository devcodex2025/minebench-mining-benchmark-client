[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.89"
# This package builds two binaries (the GUI and the CPU sensor broker), so the
# bundler must be told which one is the application.
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# A second binary that reads CPU telemetry from the kernel. It is started by the
# Windows Task Scheduler with highest privileges (registered once by the
# installer), so the GUI itself never runs elevated and the user is never asked
# for approval. It exits immediately after serving one snapshot.
[[bin]]
name = "minebench-sensor-broker"
path = "src/bin/sensor_broker.rs"


[features]
# Required by `tauri build` to embed frontendDist into the production protocol.
# Without it, Tauri builds a development context with no index.html asset.
custom-protocol = ["tauri/custom-protocol"]

[package.metadata.bundle]
windows = { subsystem = "windows" }

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
base64 = "0.22"
minisign-verify = "0.2"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sysinfo = "0.36.1"
tokio = { version = "1.52.2", features = ["full"] }
reqwest = { version = "0.13.3", features = ["json"] }
axum = "0.8.4"
tower-http = { version = "0.6.10", features = ["cors"] }
urlencoding = "2.1.3"
chrono = "0.4.44"
shared_child = "1.1.1"
uuid = { version = "1.11.0", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

# Static CPU device information (physical core count, rated clock) and the
# HWiNFO shared-memory registry interface, both read without spawning a process.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.10.1"
